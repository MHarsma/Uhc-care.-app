<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6750A4" />
      <stop offset="100%" stop-color="#7C5295" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background container rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#primaryGrad)" />

  <!-- Outer Ring Accent -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#EADDFF" stroke-width="8" stroke-dasharray="16 12" opacity="0.6"/>

  <!-- Center Card Badge with shadow -->
  <rect x="96" y="96" width="320" height="320" rx="72" fill="#FEF7FF" filter="url(#shadow)"/>

  <!-- Overlapping Hearts / Infinity Care Motif -->
  <g transform="translate(256, 250) scale(1.15)">
    <!-- Left Heart -->
    <path d="M -30,-45 C -60,-80 -110,-55 -110,-10 C -110,35 -40,75 0,110 C 40,75 110,35 110,-10 C 110,-55 60,-80 30,-45 C 0,-80 -30,-45 -30,-45 Z" fill="#6750A4" />
    <!-- Secondary Heart Overlay Accent -->
    <path d="M 0,-15 C -20,-45 -60,-25 -60,5 C -60,35 -15,65 0,85 C 15,65 60,35 60,5 C 60,-25 20,-45 0,-15 Z" fill="#B3261E" opacity="0.85"/>
  </g>

  <!-- Routine / Star sparkles -->
  <circle cx="160" cy="160" r="14" fill="#FFD8E4" />
  <circle cx="352" cy="160" r="10" fill="#E8DEF8" />
  <circle cx="360" cy="350" r="16" fill="#FFD8E4" />
</svg>
