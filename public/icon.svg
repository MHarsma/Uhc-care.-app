<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="uhcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#4F46E5" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle Base with glow -->
  <rect x="24" y="24" width="464" height="464" rx="120" fill="url(#uhcGrad)" filter="url(#shadow)"/>

  <!-- Subtle Inner Border Highlight -->
  <rect x="25" y="25" width="462" height="462" rx="119" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.2"/>

  <!-- Iconic Smooth Bold 'U' Monogram -->
  <path d="M 188 160
           L 188 285
           C 188 335 218 365 256 365
           C 294 365 324 335 324 285
           L 324 160"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="48"
        stroke-linecap="round"
        stroke-linejoin="round"/>
</svg>
